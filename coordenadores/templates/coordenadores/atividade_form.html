{% extends 'core/base.html' %}
{% load crispy_forms_tags %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="{% static 'css/cadastro.css' %}">


<div class="form-container">
    <h2>Cadastrar Atividade</h2>

    <form method="post">
        {% csrf_token %}

        {{ form|crispy }}

        <button type="submit" class="btn-salvar">
            Salvar
        </button>
    </form>
</div>

{% endblock %}
