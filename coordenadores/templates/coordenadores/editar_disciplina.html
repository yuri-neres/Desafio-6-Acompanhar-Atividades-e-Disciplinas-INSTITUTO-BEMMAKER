{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Disciplina | Instituto Bemmaker</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}"> 
    <link rel="stylesheet" href="{% static 'alunos/css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body { display: block !important; height: auto !important; background-color: #f8fafc !important; }
        .box-formulario { background: white; padding: 30px; border-radius: 8px; border-top: 4px solid #3b82f6; max-width: 800px; margin: 30px auto; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #0f2c3d; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        .btn-salvar { background-color: #3b82f6; color: white; border: none; padding: 12px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <main style="padding: 30px;">
        <div class="box-formulario">
            <a href="{% url 'coordenadores:disciplinas' %}" style="color: #0f2c3d; text-decoration: none; font-weight: bold;"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
            <h3 style="color: #0f2c3d; margin: 20px 0;">Editar Disciplina: {{ disciplina.nome }}</h3>
            
            <form method="post">
                {% csrf_token %}
                <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>Nome</label>
                        <input type="text" name="nome" value="{{ disciplina.nome }}" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Código</label>
                        <input type="text" name="codigo" value="{{ disciplina.codigo }}" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Carga Horária</label>
                        <input type="number" name="carga_horaria" value="{{ disciplina.carga_horaria }}" class="form-control" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Ementa / Descrição</label>
                    <textarea name="descricao" class="form-control">{{ disciplina.descricao }}</textarea>
                </div>
                <button type="submit" class="btn-salvar">Atualizar Disciplina</button>
            </form>
        </div>
    </main>
</body>
</html>
