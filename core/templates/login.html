<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Instituto BemMaker</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
<div class="login-box">
    <h2>Acesso ao Sistema</h2>
    {% if form.errors %}
        <p class="errorlist">Usuário ou senha inválidos. Tente novamente.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for ="id_username">Usuário:</label>
            {{ form.username }}
        </div>

        <div class="form-group">
            <label for="id_password">Senha:</label>
            {{ form.password }}
        </div>

        <button type="submit" class="btn-login">Entrar</button>
    </form>
</div>

</body>
</html>
