{%load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>{% block title %}Instituto Bemmaker{% endblock %}</title>
    
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}"> 
    <!-- Link para Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <header class="header">
        <div><img src="{% static 'img/logo-instituto-bemmaker.png' %}" alt="Logo Bemmaker" class="logo"></div>
    <div class="header-right">
        <div class="header-icons">
            <a href="#"><i class="fa-regular fa-envelope" style="display: none;"></i></a>
            <a href="#"><i class="fa-regular fa-bell" style="display: none;"></i></a>
        </div>
        <div class="usuario" style="display: none;">
            <div class="avatar" style="display: none;"></div>
            <span>Usuário</span>
        </div>
    </div>

    </header>

    <div class="container">

    <nav class="sidebar">
        <a href="#">Home</a>
        
        
    </nav>

    <main class="content">

        {% if messages %}
            {% for message in messages %}
                <div>
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        Conteúdo da página
        {% endblock %}
    </main>
    </div>
    <footer class="footer">
       © 2026 Instituto Bemmaker. Todos os direitos reservados.
    </footer>
   
</body>

</html>
