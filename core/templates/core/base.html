{%load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>{% block title %}Instituto Bemmaker{% endblock %}</title>
    
    <!-- Link para o arquivo CSS externo -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}"> 
    

</head>
<body>

    <header class="header">
        <div><img src="{% static 'img/logo-instituto-bemmaker.png' %}" alt="Logo Bemmaker" class="logo"></div>
        <div class="user-info">Usuário</div>
    </header>

    <div class="container">

    <nav class="sidebar">
        <a href="#">Início</a> 
        <a href="#">Minhas Disciplinas</a> 
        <a href="#">Atividades Acadêmicas</a>     
        
    </nav>

    <main class="content">

        {% if messages %}
            {% for message in messages %}
                <div>
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        Conteúdo da página
        {% endblock %}
    </main>

</div>
</body>
</html>
